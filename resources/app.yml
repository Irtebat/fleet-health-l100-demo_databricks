# Databricks App "Fleet Service" (AppKit, source in src/app).
#
# Three views: Fleet (synced Lakebase table), Service tickets (app-owned Lakebase table),
# Assistant (the fleet agent endpoint). Both resources below are granted to the app's service principal
# by the platform on deploy, and app.yaml maps them to env vars (LAKEBASE_ENDPOINT, DATABRICKS_SERVING_ENDPOINT_NAME).
#
# After the first deploy, grant the app SP read access to the synced table (see README.md, post-deploy steps).
# Deploy: `databricks bundle deploy`, then `databricks bundle run fleet_app` (builds + starts the app code).

resources:
  apps:
    fleet_app:
      name: fleet-app
      description: "Fleet Service: fleet health, service tickets, and AI assistant"
      source_code_path: ../src/app
      # Cost attribution: app compute billed with the demo usage policy
      usage_policy_id: ${var.usage_policy_id}
      lifecycle:
        started: true
      permissions:
        - group_name: fleet_service_admins
          level: CAN_USE
        - group_name: fleet_north_dealers
          level: CAN_USE
      resources:
        - name: postgres                 # read by app.yaml as LAKEBASE_ENDPOINT (valueFrom: postgres)
          postgres:
            branch: projects/${resources.postgres_projects.fleet_health.project_id}/branches/production
            database: projects/${resources.postgres_projects.fleet_health.project_id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: serving-endpoint         # read by app.yaml as DATABRICKS_SERVING_ENDPOINT_NAME (valueFrom: serving-endpoint)
          serving_endpoint:
            name: ${resources.model_serving_endpoints.fleet_agent.name}
            permission: CAN_QUERY
