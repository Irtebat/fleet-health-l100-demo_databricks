# One-off setup job: creates the UC connection to RDS from the UC secret.
# Run once (and again whenever the password in the UC secret is rotated).

resources:
  jobs:
    fleet_setup:
      name: fleet-setup
      usage_policy_id: ${var.usage_policy_id}
      tags:
        component: setup-job
      performance_target: STANDARD

      environments:
        - environment_key: default
          spec:
            environment_version: "4"  # UC secrets need serverless environment 4+

      tasks:
        - task_key: create_rds_connection
          environment_key: default
          spark_python_task:
            python_file: ../src/setup/create_rds_connection.py
            parameters:
              - ${var.catalog}
              - ${var.rds_host}
              - ${var.rds_connection}
