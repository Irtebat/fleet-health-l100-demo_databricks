# Medallion pipeline (Lakeflow Spark Declarative Pipelines, serverless).
# Bronze (Auto Loader) → silver (typed + expectations) → gold (materialized views).

resources:
  pipelines:
    fleet_medallion:
      name: fleet-medallion
      # Billing attribution: on serverless, only the usage policy's tags reach system.billing.usage.
      # Pipeline `tags` would only be forwarded on classic clusters, so none are set here;
      # break costs down per pipeline with usage_metadata.dlt_pipeline_id.
      usage_policy_id: ${var.usage_policy_id}
      serverless: true
      catalog: ${var.catalog}
      schema: bronze  # default schema; silver/gold tables use qualified names
      configuration:
        catalog: ${var.catalog}
      libraries:
        - file:
            path: ../src/pipeline/bronze.sql
        - file:
            path: ../src/pipeline/silver.sql
        - file:
            path: ../src/pipeline/gold.sql
