# Lakeflow Connect — query-based PostgreSQL ingestion (serverless, no gateway).
# Each run reads only rows whose updated_at is newer than the last run, and merges
# them into bronze by primary key (SCD type 1 = keep the latest version).

resources:
  pipelines:
    fleet_rds_ingestion:
      name: fleet-rds-ingestion
      # Billing attribution: on serverless, only the usage policy's tags reach system.billing.usage.
      # Pipeline `tags` would only be forwarded on classic clusters, so none are set here;
      # break costs down per pipeline with usage_metadata.dlt_pipeline_id.
      usage_policy_id: ${var.usage_policy_id}
      catalog: ${var.catalog}
      schema: bronze

      ingestion_definition:
        connection_name: ${var.rds_connection}
        objects:
          - table:
              source_catalog: fleetdb       # PostgreSQL database
              source_schema: fleet
              source_table: machines
              destination_catalog: ${var.catalog}
              destination_schema: bronze
              table_configuration:
                primary_keys: [machine_id]
                scd_type: SCD_TYPE_1
                query_based_connector_config:
                  cursor_columns: [updated_at]
          - table:
              source_catalog: fleetdb
              source_schema: fleet
              source_table: customers
              destination_catalog: ${var.catalog}
              destination_schema: bronze
              table_configuration:
                primary_keys: [customer_id]
                scd_type: SCD_TYPE_1
                query_based_connector_config:
                  cursor_columns: [updated_at]
